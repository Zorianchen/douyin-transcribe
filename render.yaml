# Render 部署配置（Blueprint）
# 用法：GitHub 仓库连到 Render 后，选 "Blueprint"，会自动读取本文件。
# 硅基流动（SiliconFlow）的 API Key 在「设置 → AI 模型（硅基流动）」中按用户填写并保存，
# 不再依赖环境变量；如需兜底也可在 Render 控制台添加 SILICONFLOW_API_KEY。
services:
  - type: web
    name: douyin-transcribe
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
